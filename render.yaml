services:
  - type: web
    name: moodle-image-generator
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: IMAGE_SERVICE
        value: stable-diffusion
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: MAX_GENERATIONS_PER_SESSION
        value: 10
