services:
  - type: web
    name: moodle-image-generator
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_GENERATIONS_PER_SESSION
        value: 10
